version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector for catalog and vector storage
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enigma-sac-postgres
    environment:
      POSTGRES_DB: enigma_sac
      POSTGRES_USER: ${POSTGRES_USER:-enigma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enigma}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enigma} -d enigma_sac"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enigma-network

  # ---------------------------------------------------------------------------
  # Redis for caching and rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: enigma-sac-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enigma-network

  # ---------------------------------------------------------------------------
  # Local embedding service (sentence-transformers)
  # ---------------------------------------------------------------------------
  embedding-service:
    image: ghcr.io/enigma-sac/embedding-service:latest
    container_name: enigma-sac-embedding
    environment:
      MODEL_NAME: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      DEVICE: cpu
      BATCH_SIZE: 32
      MAX_LENGTH: 512
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - enigma-network

  # ---------------------------------------------------------------------------
  # API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: enigma-sac-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-enigma}:${POSTGRES_PASSWORD:-enigma}@postgres:5432/enigma_sac
      REDIS_URL: redis://redis:6379
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-http://embedding-service:8080/embed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-1.0.0}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo-preview}
      ALLOWED_DATA_DOMAINS: ${ALLOWED_DATA_DOMAINS:-psi.nasa.gov,raw.githubusercontent.com,data.nasa.gov}
      MAX_DOWNLOAD_SIZE: ${MAX_DOWNLOAD_SIZE:-104857600}
      DOWNLOAD_TIMEOUT: ${DOWNLOAD_TIMEOUT:-30}
      SSRF_PROTECTION_ENABLED: ${SSRF_PROTECTION_ENABLED:-true}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    networks:
      - enigma-network
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Web Frontend (Next.js)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: enigma-sac-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NODE_ENV: ${APP_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - enigma-network

networks:
  enigma-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: