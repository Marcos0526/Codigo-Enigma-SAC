# Render deployment configuration for Enigma SAC
# Semantic Data Discovery & Interactive Dashboards
#
# For detailed setup instructions, see README.md
#
# Required environment variables to set in Render dashboard AFTER deployment:
#   - LLM_API_KEY: Your OpenAI API key (or other LLM provider key)
#   - LLM_MODEL: The model to use (default: gpt-4-turbo-preview)
#
# Auto-populated environment variables (set by Render automatically):
#   - DATABASE_URL: PostgreSQL connection string
#   - REDIS_URL: Redis connection string
#   - RENDER_EXTERNAL_URL: Your deployed site's URL (used for CORS)

services:
  # ===========================================================================
  # API Service (Python/FastAPI/uvicorn)
  # Main API backend for datasets, search, summarization, and visualization
  # Port: 8000
  # ===========================================================================
  - type: web
    name: enigma-sac-api
    env: python
    buildCommand: |
      pip install --no-cache-dir -r services/api/requirements.txt
      pip install --no-cache-dir -e packages/contracts
    startCommand: python -m uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    plan: starter
    port: 8000
    envVars:
      APP_ENV: production
      APP_PORT: 8000
      LOG_LEVEL: info
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_VERSION: 1.0.0
      EMBEDDING_DIMENSIONS: 384
      EMBEDDING_BATCH_SIZE: 32
      EMBEDDING_MAX_LENGTH: 512
      NVIDIA_API_BASE_URL: https://integrate.api.nvidia.com/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo-preview}
      LLM_MAX_TOKENS: 2000
      LLM_TEMPERATURE: 0.1
      ALLOWED_DATA_DOMAINS: psi.nasa.gov,raw.githubusercontent.com,data.nasa.gov
      MAX_DOWNLOAD_SIZE: 104857600
      DOWNLOAD_TIMEOUT: 30
      SEARCH_MIN_SCORE: 0.3
      SEARCH_MAX_RESULTS: 100
      SEARCH_RERANK_ENABLED: false
      SEARCH_RERANK_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      MAX_PROFILE_ROWS: 100000
      MAX_PROFILE_MEMORY_MB: 512
      MAX_PROFILE_TIME_SECONDS: 60
      MAX_CHART_ROWS: 10000
      MAX_CHART_MEMORY_MB: 256
      MAX_CHART_TIME_SECONDS: 30
      SSRF_PROTECTION_ENABLED: true
      RATE_LIMIT_RPM: 60
      CORS_ORIGINS: ${RENDER_EXTERNAL_URL},http://localhost:3000,http://127.0.0.1:3000

  # ===========================================================================
  # Web Frontend (Next.js)
  # React-based user interface for data discovery and visualization
  # Port: 3000
  # ===========================================================================
  - type: web
    name: enigma-sac-web
    env: node
    buildCommand: npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    plan: starter
    port: 3000
    envVars:
      NODE_ENV: production
      PORT: 3000
      API_BACKEND_URL: http://enigma-sac-api:8000
      SYNTHETIC_DATA_DIR: /opt/render/project/data/synthetic
      WEB_URL: ${RENDER_EXTERNAL_URL}
    buildFilter:
      dirs:
        - apps/web
        - packages/contracts
        - data/synthetic

  # ===========================================================================
  # PostgreSQL Database (Render Managed)
  # With pgvector extension for vector similarity search
  # Standard-2X plan recommended for production
  # ===========================================================================
  - type: postgres
    name: enigma-sac-db
    plan: standard-2x
    postgresVersion: "16"

  # ===========================================================================
  # Redis Cache (Render Managed)
  # For session storage and rate limiting
  # ===========================================================================
  - type: redis
    name: enigma-sac-redis
    plan: standard-1x

  # ===========================================================================
  # Cron Job: Periodic Catalog Ingestion
  # Ingests new datasets from NASA PSI catalog every hour
  # ===========================================================================
  - type: cron
    name: enigma-sac-catalog-ingest
    env: python
    buildCommand: |
      pip install --no-cache-dir -r services/api/requirements.txt
      pip install --no-cache-dir -e packages/contracts
    schedule: "0 * * * *"
    timeout: 600
    envVars:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      ALLOWED_DATA_DOMAINS: psi.nasa.gov,raw.githubusercontent.com,data.nasa.gov