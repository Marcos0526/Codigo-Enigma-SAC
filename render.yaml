# Render deployment configuration for Enigma SAC
# Semantic Data Discovery & Interactive Dashboards
#
# Free-tier deployment configuration (no credit card required).
# Note: Free Postgres expires after 30 days, and Free Web Services spin down
# after 15 minutes of inactivity.

services:
  # ===========================================================================
  # API Service (Python/FastAPI/uvicorn)
  # Main API backend for datasets, search, summarization, and visualization
  # Port: 8000
  # ===========================================================================
  - type: web
    name: enigma-sac-api
    runtime: python
    buildCommand: |
      pip install --no-cache-dir -r services/api/requirements.txt
      pip install --no-cache-dir -e packages/contracts
    startCommand: python -m uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "8000"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: enigma-sac-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: enigma-sac-redis
          property: connectionString
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_VERSION
        value: 1.0.0
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: EMBEDDING_MAX_LENGTH
        value: "512"
      - key: NVIDIA_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4-turbo-preview
      - key: LLM_MAX_TOKENS
        value: "2000"
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: ALLOWED_DATA_DOMAINS
        value: psi.nasa.gov,raw.githubusercontent.com,data.nasa.gov
      - key: MAX_DOWNLOAD_SIZE
        value: "104857600"
      - key: DOWNLOAD_TIMEOUT
        value: "30"
      - key: SEARCH_MIN_SCORE
        value: "0.3"
      - key: SEARCH_MAX_RESULTS
        value: "100"
      - key: SEARCH_RERANK_ENABLED
        value: "false"
      - key: SEARCH_RERANK_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: MAX_PROFILE_ROWS
        value: "100000"
      - key: MAX_PROFILE_MEMORY_MB
        value: "512"
      - key: MAX_PROFILE_TIME_SECONDS
        value: "60"
      - key: MAX_CHART_ROWS
        value: "10000"
      - key: MAX_CHART_MEMORY_MB
        value: "256"
      - key: MAX_CHART_TIME_SECONDS
        value: "30"
      - key: SSRF_PROTECTION_ENABLED
        value: "true"
      - key: RATE_LIMIT_RPM
        value: "60"
      - key: CORS_ORIGINS
        value: https://enigma-sac-web.onrender.com,http://localhost:3000,http://127.0.0.1:3000
    preDeployCommand: bash infra/init-db/init_render.sh

  # ===========================================================================
  # Web Frontend (Next.js)
  # React-based user interface for data discovery and visualization
  # Port: 3000
  # ===========================================================================
  - type: web
    name: enigma-sac-web
    runtime: node
    buildCommand: npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_BACKEND_URL
        value: https://enigma-sac-api.onrender.com
      - key: SYNTHETIC_DATA_DIR
        value: /opt/render/project/data/synthetic
      - key: WEB_URL
        value: https://enigma-sac-web.onrender.com
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
        - data/synthetic/**

  # ===========================================================================
  # Redis Cache (Render Key Value)
  # Free tier is in-memory only (ephemeral on restart)
  # ===========================================================================
  - type: keyvalue
    name: enigma-sac-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  # ===========================================================================
  # Cron Job: Periodic Catalog Ingestion (DISABLED FOR FREE TIER)
  # Render does not offer a free plan for Cron Jobs; uncomment only if you add
  # a payment method. Alternatively, trigger an API endpoint via GitHub Actions.
  # ===========================================================================
  # - type: cron
  #   name: enigma-sac-catalog-ingest
  #   runtime: python
  #   buildCommand: |
  #     pip install --no-cache-dir -r services/api/requirements.txt
  #     pip install --no-cache-dir -e packages/contracts
  #   startCommand: python -m services.api.jobs.catalog_ingest
  #   schedule: "0 * * * *"
  #   envVars:
  #     - key: APP_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: enigma-sac-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: keyvalue
  #         name: enigma-sac-redis
  #         property: connectionString
  #     - key: LLM_API_KEY
  #       sync: false
  #     - key: LLM_MODEL
  #       value: gpt-4-turbo-preview
  #     - key: ALLOWED_DATA_DOMAINS
  #       value: psi.nasa.gov,raw.githubusercontent.com,data.nasa.gov

databases:
  # ===========================================================================
  # PostgreSQL Database (Render Managed)
  # Free tier: 1 GB storage, expires after 30 days, no pgbouncer pooling
  # ===========================================================================
  - name: enigma-sac-db
    postgresMajorVersion: "16"
    plan: free
    databaseName: enigma_sac
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere