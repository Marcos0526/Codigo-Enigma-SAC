# Render deployment configuration for Enigma SAC
services:
  - type: web
    name: enigma-sac-api
    runtime: python
    buildCommand: |
      pip install --no-cache-dir -r services/api/requirements.txt
    startCommand: python -m uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "8000"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: enigma-sac-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: enigma-sac-redis
          property: connectionString
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_VERSION
        value: 1.0.0
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: EMBEDDING_MAX_LENGTH
        value: "512"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_MAX_TOKENS
        value: "2000"
      - key: LLM_TEMPERATURE
        value: "0.1"
      - key: ALLOWED_DATA_DOMAINS
        value: psi.nasa.gov,raw.githubusercontent.com,data.nasa.gov
      - key: MAX_DOWNLOAD_SIZE
        value: "104857600"
      - key: DOWNLOAD_TIMEOUT
        value: "30"
      - key: SEARCH_MIN_SCORE
        value: "0.3"
      - key: SEARCH_MAX_RESULTS
        value: "100"
      - key: SEARCH_RERANK_ENABLED
        value: "false"
      - key: SEARCH_RERANK_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: MAX_PROFILE_ROWS
        value: "100000"
      - key: MAX_PROFILE_MEMORY_MB
        value: "512"
      - key: MAX_PROFILE_TIME_SECONDS
        value: "60"
      - key: MAX_CHART_ROWS
        value: "10000"
      - key: MAX_CHART_MEMORY_MB
        value: "256"
      - key: MAX_CHART_TIME_SECONDS
        value: "30"
      - key: SSRF_PROTECTION_ENABLED
        value: "true"
      - key: RATE_LIMIT_RPM
        value: "60"
      - key: CORS_ORIGINS
        value: https://enigma-sac-web.onrender.com,http://localhost:3000,http://127.0.0.1:3000

  - type: web
    name: enigma-sac-web
    runtime: node
    buildCommand: npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_BACKEND_URL
        value: https://enigma-sac-api.onrender.com
      - key: SYNTHETIC_DATA_DIR
        value: /opt/render/project/data/synthetic
      - key: WEB_URL
        value: https://enigma-sac-web.onrender.com
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
        - data/synthetic/**

  - type: keyvalue
    name: enigma-sac-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: enigma-sac-db
    postgresMajorVersion: "16"
    plan: free
    databaseName: enigma_sac
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere